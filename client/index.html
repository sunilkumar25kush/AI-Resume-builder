<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Resume Builder - parse, optimize, and export resumes with AI" />
  <title>AI Resume Builder</title>
  <!--
    Template fonts (resume + portfolio themes) are NOT needed for first paint.
    They are injected after the page has loaded so they never block FCP/LCP.
    The UI font (Geist) is self-hosted and preloaded by the build.
  -->
  <link rel="preconnect" href="https://ai-resume-builder-2-05fx.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://ai-resume-builder-2-05fx.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <script>
    (function () {
      var FONTS_URL = "https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap";
      function inject() {
        if (document.getElementById("arb-template-fonts")) return;
        var link = document.createElement("link");
        link.id = "arb-template-fonts";
        link.rel = "stylesheet";
        link.media = "print";
        link.onload = function () { this.media = "all"; };
        link.href = FONTS_URL;
        document.head.appendChild(link);
      }
      function schedule() {
        if ("requestIdleCallback" in window) window.requestIdleCallback(inject, { timeout: 3500 });
        else setTimeout(inject, 2000);
      }
      if (document.readyState === "complete") schedule();
      else window.addEventListener("load", schedule, { once: true });
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" />
  </noscript>
  <script>
    // Apply theme before first paint to avoid flash (matches zustand persist key "arb-theme")
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem("arb-theme"));
        var dark = stored && stored.state ? stored.state.theme === "dark" : null;
        if (dark === null) dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { }
    })();
  </script>
  <style>
    :root {
      --arb-bg: #ffffff;
      --arb-fg: #09090b;
      --arb-border: rgba(0, 0, 0, 0.08);
      --arb-muted: rgba(0, 0, 0, 0.06);
      color-scheme: light dark;
    }
    .dark {
      --arb-bg: #09090b;
      --arb-fg: #f4f4f5;
      --arb-border: rgba(255, 255, 255, 0.1);
      --arb-muted: rgba(255, 255, 255, 0.06);
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--arb-bg);
      color: var(--arb-fg);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="arb-shell" style="min-height:100vh;display:flex;flex-direction:column;opacity:0.85;">
      <div style="height:54px;border-bottom:1px solid var(--arb-border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:26px;height:26px;border-radius:7px;background:#2563eb;"></div>
          <div style="width:110px;height:14px;border-radius:4px;background:var(--arb-muted);"></div>
        </div>
        <div style="width:28px;height:28px;border-radius:50%;background:var(--arb-muted);"></div>
      </div>
      <div style="flex:1;padding:24px 16px;max-width:1200px;margin:0 auto;width:100%;box-sizing:border-box;">
        <div style="width:180px;height:26px;border-radius:6px;background:var(--arb-muted);margin-bottom:8px;"></div>
        <div style="width:260px;height:13px;border-radius:4px;background:var(--arb-muted);margin-bottom:24px;opacity:0.6;"></div>
        <div style="width:100%;height:220px;border-radius:18px;background:var(--arb-muted);opacity:0.5;"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
